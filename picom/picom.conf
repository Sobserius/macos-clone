# Meadow — picom (rounded corners, no shadows, ghostty blur)
# xrender is slower than glx but does not touch the GPU driver, which avoids
# the amdgpu/Xorg freezes some Tumbleweed + Mesa combinations hit at login.
# If you want to try GLX later: backend = "glx"; vsync = true;
backend = "xrender";
vsync = false;

shadow = false;

# yabai-config parity: window corner radius 10
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Rofi'",
  "class_g = 'awesome'"
];

# ghostty: background-opacity 0.9 + background-blur
blur-background = true;
blur-method = "kernel";
blur-size = 12;
blur-strength = 8;
blur-background-frame = false;
blur-background-fixed = true;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Rofi'"
];

opacity-rule = [
  "90:class_g = 'Ghostty'"
];

wintypes:
{
  tooltip = { shadow = false; opacity = 1.0; };
  popup_menu = { shadow = false; };
  dropdown_menu = { shadow = false; };
};
